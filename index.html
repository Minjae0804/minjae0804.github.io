      (function () {
        const p = window.location.search.match(/[?&]p=([^&]+)/);
        if (p) {
          const path = decodeURIComponent(p[1]);
          const q = window.location.search.match(/[?&]q=([^&]+)/);
          const search = q ? '?' + decodeURIComponent(q[1]) : '';
          window.history.replaceState(null, null, path + search + window.location.hash);
        }
      })();

      (function() {
        const stored = localStorage.getItem("theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
